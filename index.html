<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08090b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Edifício Abismo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Special+Elite&display=swap">
<style>
/* Layout: tela única vertical — cena do prédio em cima, painel de controle metálico embaixo */
:root{
  --ink:#08090b; --steel:#16191e; --bone:#ddd5c2; --dim:#8c8677;
  --paper:#d8d0bb; --paper-ink:#24201a; --blood:#9b2318; --sodium:#e9b45c; --exit:#46d27f;
  --o2:#4fb6d8; --haz:#d9b42a; --foam:#e8ecef;
  --f-type:'Special Elite','Courier New',monospace;
  --f-hud:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  color-scheme:dark;
}
html{height:100%;box-sizing:border-box;background:var(--ink)}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:#000;overflow:hidden}
#stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}

#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:10px;padding:10px 12px;pointer-events:none;z-index:3}
.floorbox{display:flex;flex-direction:column;align-items:flex-start;padding:4px 10px 2px;background:rgba(6,6,7,.62);border:1px solid rgba(233,180,92,.32);border-radius:3px}
.floorbox .lbl{font:500 10px/1 var(--f-hud);letter-spacing:.24em;color:var(--dim)}
#floorNum{font:700 34px/1 var(--f-hud);color:var(--sodium);font-variant-numeric:tabular-nums;text-shadow:0 0 12px rgba(233,180,92,.45);min-width:2.2ch}
.mid{display:flex;flex-direction:column;gap:5px;padding-top:4px;flex:1;min-width:0}
.hrow{display:flex;gap:3px;flex-wrap:wrap;align-items:center}
.hrow svg{width:15px;height:15px;filter:drop-shadow(0 0 4px rgba(200,40,30,.6))}
.hrow svg.off{opacity:.22;filter:none}
.hrow[hidden]{display:none}
.hrow .tag{font:700 10px/1 var(--f-hud);letter-spacing:.14em;color:var(--dim);margin-right:3px}
.stats{display:flex;gap:10px;white-space:nowrap;font:500 12px/1 var(--f-hud);letter-spacing:.08em;color:var(--bone);font-variant-numeric:tabular-nums}
.stats b{color:var(--sodium);font-weight:700}
#gear{display:flex;flex-direction:column;gap:4px;font:700 11px/1 var(--f-hud);letter-spacing:.1em;font-variant-numeric:tabular-nums}
#gear .wp{color:var(--bone)}#gear .wp b{color:var(--sodium)}
#gear .bar{position:relative;display:block;width:150px;max-width:100%;height:13px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.18);border-radius:2px;overflow:hidden}
#gear .bar i{position:absolute;inset:0 auto 0 0;display:block}
#gear .bar em{position:relative;font-style:normal;padding-left:5px;line-height:12px;color:#fff;text-shadow:0 1px 2px #000}
#gear .o2 i{background:linear-gradient(90deg,#1f6f8f,var(--o2))}
#gear .hz i{background:linear-gradient(90deg,#8a6f12,var(--haz))}
#gear .ex i{background:linear-gradient(90deg,#8d9499,var(--foam))}
#gear .low i{animation:blink .5s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.tb{pointer-events:auto;display:flex;gap:6px}
.tb button{font:700 12px/1 var(--f-hud);letter-spacing:.12em;color:var(--bone);background:rgba(6,6,7,.62);border:1px solid rgba(221,213,194,.22);border-radius:3px;padding:7px 9px;cursor:pointer}
.tb button:focus-visible{outline:2px solid var(--sodium);outline-offset:2px}
#net{position:absolute;right:20px;top:58px;z-index:3;font:700 10px/1 var(--f-hud);letter-spacing:.16em;color:var(--exit);background:rgba(5,10,7,.7);padding:4px 7px;border-radius:2px;pointer-events:none}
#net[hidden]{display:none}
#depth{position:absolute;right:8px;top:80px;bottom:18px;width:5px;background:rgba(255,255,255,.06);border-radius:3px;z-index:3;pointer-events:none}
#depth i{position:absolute;left:-2px;right:-2px;height:1px;background:rgba(221,213,194,.25)}
#depth s{position:absolute;left:-1px;right:-1px;text-decoration:none;border-radius:2px;opacity:.85}
#depth u{position:absolute;left:-4px;width:13px;height:4px;border-radius:2px;transform:translateY(-2px);text-decoration:none}
#radio{position:absolute;left:12px;right:24px;bottom:12px;z-index:3;pointer-events:none;font:12.5px/1.35 var(--f-type);color:#cfe8d4;background:rgba(5,10,7,.8);border-left:3px solid var(--exit);padding:7px 10px;opacity:0;transform:translateY(6px);transition:opacity .3s,transform .3s;max-width:34em}
#radio.show{opacity:1;transform:none}
#radio small{display:block;font:700 10px/1 var(--f-hud);letter-spacing:.22em;color:var(--exit);margin-bottom:3px}
#toast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);z-index:3;font:700 20px/1.1 var(--f-hud);letter-spacing:.18em;color:var(--sodium);text-shadow:0 0 14px rgba(233,180,92,.6),0 2px 3px #000;opacity:0;transition:opacity .25s;pointer-events:none;text-align:center;width:90%}
#toast.show{opacity:1}
#warn{position:absolute;left:50%;top:126px;transform:translateX(-50%);z-index:3;pointer-events:none;font:700 14px/1.15 var(--f-hud);letter-spacing:.14em;color:#fff;background:rgba(150,20,10,.85);padding:7px 12px;border-radius:2px;text-align:center;animation:blink .7s steps(2) infinite;width:max-content;max-width:88%}
#warn[hidden]{display:none}

#pad{flex:none;height:182px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:repeating-linear-gradient(45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.018) 0 2px,transparent 2px 7px),linear-gradient(#1a1d22,#0c0e10);border-top:1px solid #2c3138;box-shadow:inset 0 1px 0 rgba(255,255,255,.05);touch-action:none;position:relative;z-index:4}
.ctrl{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;flex:1;min-width:0;--d:148px}
.ctrl.mini{--d:80px;gap:4px;flex:1 1 0}
.ctrl.mini+.ctrl.mini{border-left:1px solid #2c3138;padding-left:8px}
.ctrl .ptag{position:absolute;left:0;top:-4px;font:700 10px/1 var(--f-hud);letter-spacing:.16em;color:var(--dim)}
.dpad{width:var(--d);height:var(--d);border-radius:50%;position:relative;flex:none;background:radial-gradient(circle at 50% 42%,#2b3038,#14171b 72%);box-shadow:0 4px 0 #050607,inset 0 0 0 1px #363c45,inset 0 10px 18px rgba(255,255,255,.04);touch-action:none}
.dpad .ar{position:absolute;width:32%;height:32%;display:grid;place-items:center;color:#7d7869;transition:color .08s}
.dpad .ar svg{width:58%;height:58%;fill:currentColor}
.dpad .ar.on{color:var(--sodium);filter:drop-shadow(0 0 6px rgba(233,180,92,.8))}
.dpad .u{left:34%;top:2%}.dpad .d{left:34%;bottom:2%}.dpad .l{left:2%;top:34%}.dpad .r{right:2%;top:34%}
.dpad .hub{position:absolute;left:37%;top:37%;width:26%;height:26%;border-radius:50%;background:radial-gradient(circle at 45% 40%,#3a4049,#1a1d22);box-shadow:inset 0 0 0 1px #444b55}
.acts{display:grid;grid-template-columns:auto auto;grid-template-areas:". ext" "jump fire";gap:8px;align-items:end;justify-items:center}
.btn{display:grid;place-items:center;border-radius:50%;font:700 12px/1 var(--f-hud);letter-spacing:.12em;color:var(--bone);border:0;padding:0;cursor:pointer;touch-action:none;box-shadow:0 5px 0 #050607,inset 0 0 0 1px rgba(255,255,255,.1);transition:transform .06s,filter .06s}
.btn.on{transform:translateY(3px);box-shadow:0 2px 0 #050607,inset 0 0 0 1px rgba(255,255,255,.18);filter:brightness(1.3)}
.btn:focus-visible{outline:2px solid var(--sodium);outline-offset:3px}
.btn.jump{grid-area:jump;width:66px;height:66px;background:radial-gradient(circle at 50% 32%,#59616d,#20252c 72%)}
.btn.fire{grid-area:fire;width:82px;height:82px;background:radial-gradient(circle at 50% 32%,#c8402e,#5d120c 74%);font-size:14px}
.btn.ext{grid-area:ext;width:58px;height:58px;font-size:11px;background:radial-gradient(circle at 50% 32%,#e9ecee,#7c8489 74%);color:#1b1e21}
.btn.ext.empty{filter:grayscale(1) brightness(.55)}
.mini .btn.jump{width:40px;height:40px;font-size:8px;letter-spacing:.06em}
.mini .btn.fire{width:46px;height:46px;font-size:9px;letter-spacing:.06em}
.mini .btn.ext{width:36px;height:36px;font-size:7px;letter-spacing:.04em}
.mini .acts{gap:4px}
.ctrl.mini .ptag{top:-2px}

#screen[hidden]{display:none}
#screen{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:radial-gradient(ellipse at 50% 40%,rgba(0,0,0,.25),rgba(0,0,0,.82));overflow-y:auto}
.card{position:relative;width:100%;max-width:380px;margin:auto;background:var(--paper);color:var(--paper-ink);padding:22px 20px 18px;border-radius:2px;font:14px/1.45 var(--f-type);box-shadow:0 18px 50px rgba(0,0,0,.7);transform:rotate(-.6deg);background-image:radial-gradient(circle at 80% 10%,rgba(120,80,30,.18),transparent 40%),radial-gradient(circle at 10% 90%,rgba(90,60,20,.16),transparent 45%)}
.card .meta{font:700 10px/1.3 var(--f-hud);letter-spacing:.18em;color:#5b5243;margin:0 0 10px;text-transform:uppercase}
.card h1{font:400 40px/.95 var(--f-type);letter-spacing:.04em;margin:0 0 14px;text-wrap:balance}
.card h2{font:400 26px/1 var(--f-type);margin:0 0 12px;text-wrap:balance}
.card dl{margin:0 0 14px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13px}
.card dt{font:700 11px/1.6 var(--f-hud);letter-spacing:.14em;color:#6b6152;text-transform:uppercase}
.card dd{margin:0}
.stamp{position:absolute;right:14px;top:14px;font:700 13px/1 var(--f-hud);letter-spacing:.2em;color:#a3241a;border:2px solid #a3241a;padding:4px 7px;transform:rotate(9deg);opacity:.8}
.card .go{display:block;width:100%;margin-top:6px;padding:12px;font:700 15px/1 var(--f-hud);letter-spacing:.2em;color:var(--paper);background:#1d1a16;border:0;border-radius:2px;cursor:pointer}
.card .go.alt{background:transparent;color:var(--paper-ink);box-shadow:inset 0 0 0 1px #6b6152;margin-top:8px}
.card .go:focus-visible{outline:2px solid var(--blood);outline-offset:3px}
.card .join{display:flex;gap:8px;margin-top:8px}
.card .join input{flex:1;min-width:0;font:700 18px/1 var(--f-hud);letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:10px;background:#efe8d6;color:var(--paper-ink);border:1px solid #6b6152;border-radius:2px}
.card .join input:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.card .join .go{width:auto;margin:0;padding:12px 16px}
.card .code{display:block;font:700 46px/1 var(--f-hud);letter-spacing:.3em;text-align:center;margin:6px 0 12px;color:#a3241a}
.card .keys{margin:12px 0 0;font:500 12px/1.4 var(--f-hud);letter-spacing:.06em;color:#5b5243}
.card .err{margin:8px 0 0;font:700 12px/1.35 var(--f-hud);letter-spacing:.06em;color:#a3241a}
.card .sep{margin:14px 0 2px;font:700 10px/1 var(--f-hud);letter-spacing:.2em;color:#6b6152;text-transform:uppercase}
@media (prefers-reduced-motion:reduce){#radio,#toast,.btn{transition:none}#warn,#gear .low i{animation:none}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Edifício Abismo, jogo"></canvas>
    <div id="hud">
      <div class="floorbox"><span class="lbl">ANDAR</span><span id="floorNum">100</span></div>
      <div class="mid">
        <div id="hearts" class="hrow"></div>
        <div id="hearts2" class="hrow" hidden></div>
        <div class="stats"><span>PROVAS <b id="evid">0</b></span><span>BAIXAS <b id="kills">0</b></span><span><b id="score">0</b> PTS</span></div>
        <div id="gear"></div>
      </div>
      <div class="tb"><button id="muteBtn" type="button">SOM</button><button id="pauseBtn" type="button">II</button></div>
    </div>
    <div id="net" hidden></div>
    <div id="depth"></div>
    <div id="warn" hidden></div>
    <div id="radio"></div>
    <div id="toast"></div>
    <div id="screen"></div>
  </div>
  <div id="pad"></div>
</div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const C=$('c'),ctx=C.getContext('2d');
const LC=document.createElement('canvas'),lctx=LC.getContext('2d');
const FLOORS=100,H=128,SLAB=12,RH=H-SLAB,BW=768,SW=116,WALL=26,VW=330;
const GRAV=980,SPEED=118,JUMP=345,ELSPD=120,O2MAX=60,HAZMAX=80,CROUCH=18;
const FULLW=RH*0.88,HALFW=RH*0.5,BREATH=15,FT_D=8,FT_H=58,FT_H2=70,FT_F=115,FT_TOTAL=125;
const ys=f=>(FLOORS-f)*H;
const roomOf=y=>FLOORS-Math.ceil(y/H-1e-6);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function rng(s){let a=s>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hash=n=>{const s=Math.sin(n*127.1+311.7)*43758.5453;return s-Math.floor(s)};
const RND=Math.random;

let DPR=1,cssW=1,cssH=1,zoom=1,S=1,VH=600,LS=1,CS=0;
const roomCache=new Map(),slabCache=new Map();
const SPR={};
function mk(w,h,sc){sc=sc||CS;const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*sc));c.height=Math.max(1,Math.ceil(h*sc));const g=c.getContext('2d');g.setTransform(sc,0,0,sc,0,0);return{c,g}}
function resize(){
  const r=$('stage').getBoundingClientRect();cssW=Math.max(200,r.width);cssH=Math.max(200,r.height);
  DPR=Math.min(window.devicePixelRatio||1,2);
  C.width=Math.round(cssW*DPR);C.height=Math.round(cssH*DPR);
  zoom=cssW/VW;VH=cssH/zoom;S=DPR*zoom;LS=S*0.5;
  LC.width=Math.ceil(VW*LS);LC.height=Math.ceil(VH*LS);
  const ncs=Math.min(S,2.6);if(Math.abs(ncs-CS)>0.01){CS=ncs;buildSprites();roomCache.clear();slabCache.clear()}
  buildVignette();
}
function poly(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function trefoil(g,x,y,r,fg,bg){
  if(bg){g.fillStyle=bg;g.beginPath();g.arc(x,y,r*1.15,0,7);g.fill()}
  g.fillStyle=fg;for(let i=0;i<3;i++){const a=-Math.PI/2+i*Math.PI*2/3;g.beginPath();g.moveTo(x,y);g.arc(x,y,r,a-0.52,a+0.52);g.closePath();g.fill()}
  if(bg){g.fillStyle=bg;g.beginPath();g.arc(x,y,r*0.3,0,7);g.fill()}g.fillStyle=fg;g.beginPath();g.arc(x,y,r*0.18,0,7);g.fill();
}

/* ================= NÍVEL ================= */
let L=null;
function stairOf(f){
  if(f<1||f>FLOORS)return null;
  if(L&&L.floors[f]&&L.floors[f].kind==='water')return null;
  const ev=f%2===0;return{e:ev?74:BW-74,d:ev?1:-1};
}
function landingOf(f){const s=stairOf(f+1);return s?s.e+s.d*SW:null}
const stairBlocked=f=>{const F=L.floors[f];return F.stairBlock==='rubble'||(F.stairBlock==='lock'&&!F.unlocked)};
function blocked(f){
  const a=[[0,WALL+30],[BW-WALL-30,BW]];
  const s=stairOf(f);if(s){a.push([s.e-30,s.e+30]);const sx=s.e+s.d*58;a.push([sx-26,sx+26])}
  const s2=stairOf(f+1);if(s2){const x1=s2.e,x2=s2.e+s2.d*SW;a.push([Math.min(x1,x2)-6,Math.max(x1,x2)+6])}
  for(const sh of L.shafts)if(f>=sh.bottom&&f<=sh.top)a.push([sh.x-36,sh.x+70]);
  if(f===0){a.push([BW/2-64,BW/2+64]);a.push([206,344]);a.push([456,564])}
  return a;
}
const freeAt=(x0,x1,a)=>a.every(([p,q])=>x1<p||x0>q);
function freeSpot(R,f,half,used,noDoors){
  const F=L.floors[f],a=blocked(f);
  for(let t=0;t<220;t++){
    const x=WALL+50+R()*(BW-2*WALL-100);
    if(!freeAt(x-half,x+half,a))continue;
    if(!noDoors&&F.doors.some(d=>Math.abs(d.x-x)<20+half+6))continue;
    if(F.holes.some(h=>x+half>h.x-10&&x-half<h.x+h.w+10))continue;
    if(used&&used.some(u=>Math.abs(u-x)<half*2+20))continue;
    return x;
  }
  return null;
}
function newFloor(f,seed){return{f,kind:'normal',stairBlock:null,unlocked:false,special:null,zone:null,doors:[],holes:[],lamps:[],windows:[],wires:[],decals:[],nest:[],chest:null,fires:[],exts:[],key:null,barrels:[],puddles:[],anims:[],air:null,dcracks:[],wl:0,floaters:null,populated:false,spreadT:6,seed:(seed*131+f*977+13)>>>0,grace:0}}
function genLevel(seed){
  const R=rng(seed);
  L={seed,floors:[],shafts:[],zones:[],flood:{on:false,front:100,ft:0}};
  for(let f=0;f<=FLOORS;f++)L.floors.push(newFloor(f,seed));
  const reserved=new Set();
  const pickX=()=>240+Math.round(R()*29)*10;
  const cyc=['fire','water','fire','rad'];const rot=Math.floor(R()*4);
  const plan=[];for(let i=0;i<10;i++)plan.push(cyc[(i+rot)%4]);
  let top=94-Math.floor(R()*2);
  for(const type of plan){
    if(type==='fire'){
      const f=top,len=3+Math.floor(R()*2);if(f-len<5)break;
      const F=L.floors[f];F.kind='fire';F.stairBlock='rubble';
      const z={type:'fire',top:f,bottom:f,entry:f};F.zone=z;L.zones.push(z);
      L.shafts.push({x:pickX(),top:f,bottom:f-len,fire:true,locked:true,zone:z});
      for(let k=f-len;k<=f;k++)reserved.add(k);
      top=f-len-(3+Math.floor(R()*3));
    }else if(type==='water'){
      const entry=top,wt=top-1,wb=wt-4;if(wb<5)continue;
      const z={type:'water',top:wt,bottom:wb,entry};L.zones.push(z);
      for(let k=wb;k<=wt;k++){L.floors[k].kind='water';L.floors[k].zone=z;reserved.add(k)}
      const E=L.floors[entry];E.stairBlock='water';E.special='dive';E.zone=z;
      top=wb-1-(3+Math.floor(R()*3));
    }else{
      const entry=top,zt=top-1,zb=zt-4;if(zb<5)continue;
      const z={type:'rad',top:zt,bottom:zb,entry};L.zones.push(z);
      for(let k=zb;k<=zt;k++){L.floors[k].kind='rad';L.floors[k].zone=z}
      const E=L.floors[entry];E.stairBlock='rubble';E.special='hazmat';E.zone=z;
      L.floors[zb].stairBlock='lock';
      L.shafts.push({x:pickX(),top:entry,bottom:zt-1,rad:true,zone:z});
      for(let k=zb;k<=entry;k++)reserved.add(k);
      top=zb-1-(3+Math.floor(R()*3));
    }
  }
  let t=99,prevX=-999;
  while(t>0){
    if(reserved.has(t)){t--;continue}
    const len=3+Math.floor(R()*6);let b=t;
    while(b-1>=Math.max(0,t-len)&&!reserved.has(b-1))b--;
    if(b===t){t--;continue}
    let x,k=0;do{x=pickX();k++}while(k<60&&Math.abs(x-prevX)<140);
    L.shafts.push({x,top:t,bottom:b});prevX=x;
    t=b-(R()<0.45?1+Math.floor(R()*2):0);
  }
  L.shafts.sort((a,b)=>b.top-a.top);
  L.shafts.forEach((sh,i)=>{sh.idx=i;sh.name=String.fromCharCode(65+i%26);sh.floor=sh.top;sh.target=sh.top;sh.y=ys(sh.top)});
  for(let f=0;f<FLOORS;f++){

  <dl><dt>Provas</dt><dd>${GS.evid}</dd><dt>Baixas</dt><dd>${GS.kills}</dd><dt>Pontos</dt><dd>${GS.score}</dd></dl>
  ${GS.cp<100?`<button class="go" id="cpBtn" type="button">CONTINUAR DO ANDAR ${GS.cp}</button>`:''}
  <button class="go ${GS.cp<100?'alt':''}" id="rsBtn" type="button">${isNet()?'VOLTAR AO MENU':'RECOMEÇAR DO TELHADO'}</button>`);
  const cp=$('cpBtn');if(cp)cp.onclick=()=>{scr.hidden=true;GS.mode='play';enemies=enemies.filter(()=>MODE==='guest');for(const F of L.floors)for(const n of F.nest)n.spawned=false;for(const q of PL)if(q.local)spawnAt(q,GS.cp);if(L.flood.on){L.flood.front=GS.cp;L.flood.ft=0;for(const F of L.floors)F.wl=floodTarget(F.f)}GS.score=Math.max(0,GS.score-300);hudCache=''};
  $('rsBtn').onclick=async()=>{scr.hidden=true;if(isNet()){await leaveNet();MODE='solo';GS.mode='title';PL=[];showTitle();return}newGame(L.seed,MODE);GS.mode='play'};
}
function doWin(){
  if(GS.mode!=='play')return;GS.mode='won';for(const p of PL)if(p.local)p.state='hidden2';
  const bonus=Math.max(0,3000-Math.floor(GS.time)*2);GS.score+=bonus;updateHUD();
  radio('Unidade 12 saiu do prédio. Ocorrência encerrada.');
  setTimeout(()=>{card(`<div class="stamp">ENCERRADO</div><p class="meta">Relatório final · Unidade 12</p><h2>${PL.length>1?'Vocês chegaram':'Você chegou'} ao térreo</h2>
  <dl><dt>Tempo</dt><dd>${fmtTime(GS.time)}</dd><dt>Provas</dt><dd>${GS.evid}</dd><dt>Baixas</dt><dd>${GS.kills}</dd><dt>Bônus</dt><dd>${bonus}</dd><dt>Pontos</dt><dd>${GS.score}</dd></dl>
  <button class="go" id="againBtn" type="button">${isNet()?'VOLTAR AO MENU':'NOVO PRÉDIO'}</button>`);
  $('againBtn').onclick=async()=>{scr.hidden=true;if(isNet()){await leaveNet();MODE='solo';GS.mode='title';PL=[];showTitle();return}newGame((Math.random()*1e9)|0,MODE);GS.mode='play'}},900);
}
let paused=false;
function setPause(v){if(v&&(GS.mode!=='play'))return;if(v&&isNet()){toast('SEM PAUSA NO ONLINE');return}paused=v;$('pauseBtn').textContent=v?'▶':'II';if(v){card(`<p class="meta">Pausa</p><h2>Rádio em silêncio</h2><button class="go" id="resBtn" type="button">CONTINUAR</button><button class="go alt" id="menuBtn" type="button">MENU INICIAL</button>`);$('resBtn').onclick=()=>setPause(false);$('menuBtn').onclick=()=>{paused=false;$('pauseBtn').textContent='II';GS.mode='title';PL=[];buildPad(1);showTitle();if(AU.ctx)AU.ctx.resume()}}else scr.hidden=true;if(AU.ctx){v?AU.ctx.suspend():AU.ctx.resume()}}
$('pauseBtn').onclick=()=>setPause(!paused);
$('muteBtn').onclick=()=>{auInit();AU.on=!AU.on;if(AU.master)AU.master.gain.value=AU.on?0.7:0;$('muteBtn').textContent=AU.on?'SOM':'MUDO'};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&GS.mode==='play'&&!paused&&!isNet())setPause(true)});

/* ================= CONTROLES ================= */
const arrowSVG={u:'M12 5l8 11H4z',d:'M12 19L4 8h16z',l:'M5 12l11-8v16z',r:'M19 12L8 20V4z'};
function buildPad(n){
  const pad=$('pad');pad.innerHTML='';
  for(let i=0;i<n;i++){
    const c=document.createElement('div');c.className='ctrl'+(n>1?' mini':'');c.dataset.p=i;
    c.innerHTML=(n>1?`<span class="ptag" style="color:${i?'#7fd3ff':'#e9b45c'}">J${i+1}</span>`:'')+
      `<div class="dpad" aria-label="Direcional">${['u','d','l','r'].map(k=>`<span class="ar ${k}"><svg viewBox="0 0 24 24"><path d="${arrowSVG[k]}"/></svg></span>`).join('')}<span class="hub"></span></div>
      <div class="acts"><button class="btn ext" type="button" data-p="${i}">APAGAR</button><button class="btn jump" type="button">PULAR</button><button class="btn fire" type="button">ATIRAR</button></div>`;
    pad.appendChild(c);
    if(n>1&&i===1){c.style.flexDirection='row-reverse'}
    wireCtrl(c,i);
  }
}
function wireCtrl(c,pi){
  const dp=c.querySelector('.dpad'),I=IN[pi];const arr={up:dp.querySelector('.u'),down:dp.querySelector('.d'),left:dp.querySelector('.l'),right:dp.querySelector('.r')};
  let id=null;
  const vis=()=>{for(const k in arr)arr[k].classList.toggle('on',!!I[k])};
  const set=e=>{const r=dp.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),dz=r.width*0.12;
    I.left=dx<-dz&&Math.abs(dx)>Math.abs(dy)*0.5;I.right=dx>dz&&Math.abs(dx)>Math.abs(dy)*0.5;I.up=dy<-dz&&Math.abs(dy)>Math.abs(dx)*0.5;I.down=dy>dz&&Math.abs(dy)>Math.abs(dx)*0.5;vis()};
  dp.addEventListener('pointerdown',e=>{e.preventDefault();auInit();id=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}set(e)});
  dp.addEventListener('pointermove',e=>{if(e.pointerId===id)set(e)});
  for(const ev of ['pointerup','pointercancel','lostpointercapture'])dp.addEventListener(ev,e=>{if(e.pointerId===id){id=null;I.left=I.right=I.up=I.down=false;vis()}});
  c._vis=vis;
  for(const [sel,k] of [['.btn.jump','jump'],['.btn.fire','fire'],['.btn.ext','ext']]){const b=c.querySelector(sel);
    b.addEventListener('pointerdown',e=>{e.preventDefault();auInit();I[k]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}});
    for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>{I[k]=false;b.classList.remove('on')});}
}
function padVis(){document.querySelectorAll('.ctrl').forEach(c=>c._vis&&c._vis())}
document.addEventListener('contextmenu',e=>e.preventDefault());
const KM1={ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',Space:'jump',KeyZ:'jump',KeyK:'jump',KeyX:'fire',KeyJ:'fire',KeyF:'fire',KeyC:'ext',KeyG:'ext',KeyE:'ext'};
const KM2a={KeyA:'left',KeyD:'right',KeyW:'up',KeyS:'down',Space:'jump',KeyF:'fire',KeyG:'ext'};
const KM2b={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',KeyK:'jump',KeyL:'fire',KeyJ:'ext'};
function keyTarget(code){if(MODE==='local2'){if(KM2a[code])return[0,KM2a[code]];if(KM2b[code])return[1,KM2b[code]];return null}return KM1[code]?[0,KM1[code]]:null}
addEventListener('keydown',e=>{if(e.target&&e.target.tagName==='INPUT')return;const t=keyTarget(e.code);if(t&&scr.hidden){e.preventDefault();IN[t[0]][t[1]]=true;padVis();auInit()}if(e.code==='KeyP'||e.code==='Escape')setPause(!paused)});
addEventListener('keyup',e=>{const t=keyTarget(e.code);if(t){IN[t[0]][t[1]]=false;padVis()}});
addEventListener('blur',()=>{for(const I of IN)for(const k in I)I[k]=false;padVis()});

/* ================= LOOP ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  requestAnimationFrame(frame);
  try{if(!paused){update(dt);prewarm()}render()}catch(err){if(!frame.err){frame.err=1;console.error(err)}}
}
function boot(){
  resize();buildSky();genLevel(12345);buildDepth();buildPad(1);
  addEventListener('resize',()=>{resize()});
  showTitle();requestAnimationFrame(frame);
}
boot();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{buildSprites();roomCache.clear();slabCache.clear()});
})();
</script>
